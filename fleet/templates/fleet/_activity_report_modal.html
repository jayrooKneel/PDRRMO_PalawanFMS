<div class="modal fade" id="generateReportModal" tabindex="-1" aria-labelledby="generateReportModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header text-white" style="background-color: #1A365D;">
                <h5 class="modal-title fw-bold" id="generateReportModalLabel">
                    <i class="fa-solid fa-file-export text-info me-2"></i>Generate Fleet Report
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form method="get" action="{% url 'dashboard_portal:fleet_activity_report' %}" id="generateReportForm">
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="report-kind" class="form-label fw-semibold">Report</label>
                        <select id="report-kind" name="report_kind" class="form-select" required>
                            <option value="activity">Deployment and return activity</option>
                            <option value="maintenance">Maintenance</option>
                            <option value="damage">Damage and fault reports</option>
                            <option value="incident">Incident reports</option>
                            {% if can_generate_driver_report %}<option value="drivers">Drivers and operators</option>{% endif %}
                        </select>
                    </div>
                    <div class="border rounded p-3 mb-3 d-none" id="driver-report-filters">
                        <div class="fw-semibold mb-2">Driver report filters</div>
                        <div class="mb-3">
                            <label for="driver-report-type" class="form-label">Operator type</label>
                            <select id="driver-report-type" name="operator_type" class="form-select" disabled>
                                <option value="all">All land and seacraft operators</option>
                                <option value="land">Land drivers</option>
                                <option value="sea">Seacraft operators</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="driver-report-record-status" class="form-label">Record status</label>
                            <select id="driver-report-record-status" name="record_status" class="form-select" disabled>
                                <option value="active" selected>Active only</option>
                                <option value="archived">Archived only</option>
                                <option value="all">Active and archived</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="driver-report-license-status" class="form-label">License status</label>
                            <select id="driver-report-license-status" name="license_status" class="form-select" disabled>
                                <option value="all">All license statuses</option>
                                <option value="valid">Valid</option>
                                <option value="expiring">Expiring within 30 days</option>
                                <option value="expired">Expired</option>
                                <option value="missing">Expiry date not recorded</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="driver-report-driver-type" class="form-label">Driver type</label>
                            <select id="driver-report-driver-type" name="driver_type" class="form-select" disabled>
                                <option value="all">All driver types</option>
                                <option value="professional">Professional</option>
                                <option value="non_professional">Non-Professional</option>
                                <option value="unknown">Not identified</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="driver-report-assignment" class="form-label">Vehicle assignment</label>
                            <select id="driver-report-assignment" name="assignment_status" class="form-select" disabled>
                                <option value="all">All operators</option>
                                <option value="assigned">Assigned to an asset</option>
                                <option value="unassigned">Unassigned</option>
                            </select>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col">
                                <label for="driver-report-expiry-start" class="form-label">Expiry from</label>
                                <input type="date" id="driver-report-expiry-start" name="expiry_start" class="form-control" disabled>
                            </div>
                            <div class="col">
                                <label for="driver-report-expiry-end" class="form-label">Expiry to</label>
                                <input type="date" id="driver-report-expiry-end" name="expiry_end" class="form-control" disabled>
                            </div>
                        </div>
                        <div>
                            <label for="driver-report-search" class="form-label">Search name or license number</label>
                            <input type="search" id="driver-report-search" name="search" class="form-control" maxlength="100" disabled>
                        </div>
                    </div>
                    <div class="mb-3 d-none" id="maintenance-category-field">
                        <label for="maintenance-category" class="form-label fw-semibold">Maintenance type</label>
                        <select id="maintenance-category" name="maintenance_category" class="form-select">
                            <option value="all">All maintenance</option>
                            <option value="regular">Scheduled maintenance (all types)</option>
                            <option value="other">Other maintenance and repairs</option>
                        </select>
                    </div>
                    <div class="mb-3 d-none" id="report-vehicle-field">
                        <label for="report-vehicle" class="form-label fw-semibold">Fleet asset</label>
                        <select id="report-vehicle" name="vehicle_id" class="form-select" disabled>
                            <option value="">All vehicles and seacraft</option>
                            {% for vehicle in fleet_assets %}
                            <option value="{{ vehicle.pk }}">{{ vehicle.model_name }} — {{ vehicle.plate_number }}</option>
                            {% endfor %}
                        </select>
                        <div class="form-text">Choose one asset for its maintenance history, or leave all assets selected.</div>
                    </div>
                    <div id="report-period-controls">
                    <div class="mb-3">
                        <label for="report-period" class="form-label fw-semibold">Reporting period</label>
                        <select id="report-period" name="period" class="form-select" required>
                            <option value="month">Monthly</option>
                            <option value="week">Weekly</option>
                            <option value="day">Daily</option>
                            <option value="custom">Custom date range</option>
                        </select>
                    </div>
                    <div class="mb-3 report-date-field" data-period="month">
                        <label for="report-month" class="form-label fw-semibold">Month</label>
                        <input type="month" id="report-month" name="month" class="form-control" value="{% now 'Y-m' %}" required>
                    </div>
                    <div class="mb-3 report-date-field d-none" data-period="week">
                        <label for="report-week" class="form-label fw-semibold">Week</label>
                        <input type="week" id="report-week" name="week" class="form-control" disabled>
                    </div>
                    <div class="mb-3 report-date-field d-none" data-period="day">
                        <label for="report-day" class="form-label fw-semibold">Day</label>
                        <input type="date" id="report-day" name="day" class="form-control" disabled>
                    </div>
                    <div class="report-date-field d-none" data-period="custom">
                        <div class="mb-3">
                            <label for="report-start-date" class="form-label fw-semibold">Start date</label>
                            <input type="date" id="report-start-date" name="start_date" class="form-control" disabled>
                        </div>
                        <div class="mb-3">
                            <label for="report-end-date" class="form-label fw-semibold">End date</label>
                            <input type="date" id="report-end-date" name="end_date" class="form-control" disabled>
                        </div>
                    </div>
                    </div>
                    <div class="border-top pt-3 mt-3">
                        <button type="button" class="btn btn-outline-danger" data-open-incident-report>
                            <i class="fa-solid fa-triangle-exclamation me-1"></i>File incident
                        </button>
                    </div>
                </div>
                <div class="modal-footer bg-light d-flex flex-wrap justify-content-between">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <div class="d-flex flex-wrap gap-2">
                        <button type="submit" name="format" value="print" class="btn btn-primary fw-semibold"><i class="fa-solid fa-print me-1"></i>Print</button>
                        <button type="submit" name="format" value="csv" class="btn btn-outline-primary fw-semibold"><i class="fa-solid fa-file-csv me-1"></i>CSV</button>
                        <button type="submit" name="format" value="xlsx" class="btn btn-success fw-semibold"><i class="fa-solid fa-file-excel me-1"></i>Excel</button>
                        <button type="submit" name="format" value="pdf" class="btn btn-danger fw-semibold"><i class="fa-solid fa-file-pdf me-1"></i>PDF</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% include "fleet/_fleet_incident_modal.html" %}
