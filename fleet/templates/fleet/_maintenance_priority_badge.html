      data-maintenance-priority="{{ asset.maintenance_priority }}">
    {% if asset.maintenance_priority == 'URGENT' %}URGENT{% elif asset.maintenance_priority == 'HIGH' %}HIGH PRIORITY{% else %}NORMAL PRIORITY{% endif %}
</span>
