{% with documents=asset.registration_documents.all %}
    {% if documents %}
    <details class="vehicle-documents small mt-2">
        <summary class="text-primary text-decoration-underline">View registration documents</summary>
        <div class="mt-1">
            {% for document in documents %}
            <a class="d-inline-block me-2" href="{% url 'dashboard_portal:logistics_registration_document' document.id %}" target="_blank" rel="noopener">
                <i class="fa-solid fa-paperclip me-1"></i>View image {{ forloop.counter }}
            </a>
            {% endfor %}
        </div>
    </details>
    {% endif %}
{% endwith %}
