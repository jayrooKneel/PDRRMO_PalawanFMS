{% with documents=asset.registration_documents.all %}
    {% if documents %}
    <div class="small mt-2">
        <span class="text-muted d-block">OR/CR attachments:</span>
        {% for document in documents %}
        <a class="d-inline-block me-2" href="{% url 'dashboard_portal:logistics_registration_document' document.id %}">
            <i class="fa-solid fa-paperclip me-1"></i>Image {{ forloop.counter }}
        </a>
        {% endfor %}
    </div>
    {% endif %}
{% endwith %}
